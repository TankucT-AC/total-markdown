# Builds the alpha release packages across Linux, Windows, and macOS,
# and publishes them to the GitHub release of the pushed tag (or workflow dispatch).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian:
    name: Debian package (trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper cmake ca-certificates git \
            qt6-base-dev qt6-svg-dev libkf6syntaxhighlighting-dev

      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect the package
        run: |
          mkdir dist
          mv ../*.deb dist/

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: total-markdown-deb
          path: dist/*.deb
          if-no-files-found: error

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git sed

      - name: Create an unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Prepare PKGBUILD for current tag
        working-directory: packaging/arch
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == v* ]]; then
            ver="${tag#v}"
            archver="${ver//-/}"
            sed -i "s/^pkgver=.*/pkgver=${archver}/" PKGBUILD
            sed -i "s|#tag=.*|#tag=${tag}\")|" PKGBUILD
          fi

      - name: Build the package
        working-directory: packaging/arch
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -sf --noconfirm

      - name: Smoke-test the package
        run: |
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen total-markdown --version

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: total-markdown-pkg
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  linux-portable:
    name: Linux Portable Tarball
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ca-certificates git \
            qt6-base-dev qt6-svg-dev libkf6syntaxhighlighting-dev

      - name: Check out the source
        uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMMD_BUNDLE_KSYNTAX=ON
          cmake --build build

      - name: Run tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure

      - name: Package portable archive
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" != v* ]] && tag="v0.2.0-alpha2"
          version="${tag#v}"
          DESTDIR="$PWD/staging" cmake --install build
          mkdir -p dist
          tar -czvf "dist/total-markdown-${version}-linux-x86_64.tar.gz" -C staging/usr .

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: total-markdown-linux-portable
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 Package
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-syntax-highlighting
            zip

      - name: Check out the source
        uses: actions/checkout@v4

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        shell: msys2 {0}
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure

      - name: Package Windows ZIP
        shell: msys2 {0}
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" != v* ]] && tag="v0.2.0-alpha2"
          version="${tag#v}"
          pkg_dir="total-markdown-${version}-windows-x64"
          mkdir -p "${pkg_dir}"

          cp build/src/total-markdown.exe "${pkg_dir}/"
          windeployqt --no-translations --compiler-runtime "${pkg_dir}/total-markdown.exe"

          mkdir -p "${pkg_dir}/microtex"
          cp -r third_party/microtex/res "${pkg_dir}/microtex/"

          if [ -d "/ucrt64/share/org.kde.syntax-highlighting" ]; then
            mkdir -p "${pkg_dir}/share/org.kde.syntax-highlighting"
            cp -r /ucrt64/share/org.kde.syntax-highlighting/* "${pkg_dir}/share/org.kde.syntax-highlighting/"
          fi

          cp LICENSE "${pkg_dir}/"
          zip -r "${pkg_dir}.zip" "${pkg_dir}"
          mkdir -p dist
          mv "${pkg_dir}.zip" dist/

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: total-markdown-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon (arm64) Package
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: |
          brew install qt ninja
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      - name: Check out the source
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build

      - name: Test
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure

      - name: Package macOS DMG and ZIP
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" != v* ]] && tag="v0.2.0-alpha2"
          version="${tag#v}"

          app_bundle="build/src/Total Markdown.app"

          # Bundle MicroTeX LaTeX fonts and resources
          mkdir -p "$app_bundle/Contents/Resources/microtex"
          cp -r third_party/microtex/res "$app_bundle/Contents/Resources/microtex/"

          # Deploy Qt frameworks and plugins
          macdeployqt "$app_bundle" -dmg

          mkdir -p dist
          dmg_name="total-markdown-${version}-macos-arm64.dmg"
          zip_name="total-markdown-${version}-macos-arm64.zip"

          mv "build/src/Total Markdown.dmg" "dist/$dmg_name"
          (cd build/src && zip -r -y "../../dist/$zip_name" "Total Markdown.app")

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: total-markdown-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [debian, arch, linux-portable, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums and Release Notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

          tag="${GITHUB_REF_NAME}"
          [[ "$tag" != v* ]] && tag="v0.2.0-alpha2"
          version="${tag#v}"

          cat << 'EOF' > notes.md
          # Total Markdown ${version} (Alpha 2)

          The second public alpha release of **Total Markdown** brings official multi-platform packages for **Windows** and **macOS**, along with major rendering speed optimizations and UI improvements.

          ### Downloads

          | Platform | File | Description |
          | :--- | :--- | :--- |
          | **Windows** | `total-markdown-${version}-windows-x64.zip` | Standalone portable zip for Windows 10/11 (x64). Unzip and run `total-markdown.exe`. |
          | **macOS** | `total-markdown-${version}-macos-arm64.dmg` | Disk image for Apple Silicon Macs (M1/M2/M3/M4, macOS 12+). Open and drag to Applications. |
          | **macOS** | `total-markdown-${version}-macos-arm64.zip` | Portable `.app` zip bundle for Apple Silicon Macs. |
          | **Linux (Debian/Ubuntu)** | `total-markdown_${version}~alpha2_amd64.deb` | Debian 13+, Ubuntu 25.04+ package (`sudo apt install ./...deb`). |
          | **Linux (Arch Linux)** | `total-markdown-${version}alpha2-1-x86_64.pkg.tar.zst` | Arch / Manjaro package (`sudo pacman -U ...`). |
          | **Linux (Portable)** | `total-markdown-${version}-linux-x86_64.tar.gz` | Portable binary tarball with bundled KSyntaxHighlighting engine. |

          ### Highlights in this Release

          - **Multi-Platform Support**: Official binaries for Windows (x64) and macOS (Apple Silicon arm64).
          - **Major Rendering Performance**: Added `LocalImageCache` with in-memory caching and fast 2-step downsampling; re-render times on image-heavy documents dropped from ~722 ms to **7–16 ms** (~50x–100x speedup).
          - **Table Cell Image Constraints**: Images in HTML and GFM table cells are now proportionally constrained to cell width, preventing tables from expanding horizontally.
          - **Header & Architecture Modernization**: Standardized `#ifndef` include guards across all translation units.
          - **UI & Usability**: Refined responsive margins, outline navigation, and find strip.

          ### Verification
          Checksums for all downloadable files are available in `SHA256SUMS.txt`.

          *Note: As an alpha release, packages are currently unsigned. On Windows, click "More info -> Run anyway" if prompted by SmartScreen. On macOS, right-click the app and choose "Open" on first launch.*
          EOF
          # Substitute the version variable into notes.md
          sed -i "s/\${version}/${version}/g" notes.md

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" != v* ]] && tag="v0.2.0-alpha2"
          version="${tag#v}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Total Markdown $version" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" --title "Total Markdown $version" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
